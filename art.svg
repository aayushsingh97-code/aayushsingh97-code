<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <rect width="500" height="200" fill="#0d1117"/>
  <g stroke="#58a6ff" fill="none" stroke-width="1.5">
    <circle cx="250" cy="100" r="20">
      <animate attributeName="r" values="20;70;20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="100" r="40">
      <animate attributeName="r" values="40;90;40" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="250" y="105" fill="#c9d1d9" font-family="monospace" font-size="14" text-anchor="middle">&lt;/&gt; hello world</text>
</svg>
